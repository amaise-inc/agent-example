name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-example-spring:
    runs-on: ubuntu-latest
    # The NVD API is unstable and this repo has no warmed NVD cache, so skip the OWASP
    # dependency-check here (the monorepo CI leaves this unset and runs the scan).
    env:
      SKIP_DEPENDENCY_AUDIT: 'true'

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agent-example-spring/pom.xml
      - name: Build with Maven
        working-directory: agent-example-spring
        run: make verify

  build-example-quarkus:
    runs-on: ubuntu-latest
    env:
      SKIP_DEPENDENCY_AUDIT: 'true'

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agent-example-quarkus/pom.xml
      - name: Build with Maven
        working-directory: agent-example-quarkus
        run: make verify

  build-example-nodejs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent-example-nodejs/package-lock.json

      - name: Install, generate, verify, and dep-check
        working-directory: agent-example-nodejs
        run: |
          npm ci
          wget -q -O openapi-agent.json "https://api.eu.amaise.com/doc/api-documentation/AGENT-SDK"
          npm run generate
          make verify
          make dep-check

  notify-failure:
    name: "Notify Failure"
    needs: [build-example-spring, build-example-quarkus, build-example-nodejs]
    if: >-
      always()
      && (needs.build-example-spring.result == 'failure'
      || needs.build-example-quarkus.result == 'failure'
      || needs.build-example-nodejs.result == 'failure')
    uses: ./.github/workflows/_notify-slack.yml
    with:
      environment: ci
      status: failure
    secrets:
      SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
