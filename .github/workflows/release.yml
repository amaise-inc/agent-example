name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-example-spring:
    runs-on: ubuntu-latest
    # The NVD API is unstable and this repo has no warmed NVD cache, so skip the OWASP
    # dependency-check here (the monorepo CI leaves this unset and runs the scan).
    env:
      SKIP_DEPENDENCY_AUDIT: 'true'

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agent-example-spring/pom.xml
      - name: Build with Maven
        working-directory: agent-example-spring
        run: make verify

  build-example-quarkus:
    runs-on: ubuntu-latest
    env:
      SKIP_DEPENDENCY_AUDIT: 'true'

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: agent-example-quarkus/pom.xml
      - name: Build with Maven
        working-directory: agent-example-quarkus
        run: make verify

  build-example-nodejs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent-example-nodejs/package-lock.json

      - name: Install, generate, verify, and dep-check
        working-directory: agent-example-nodejs
        run: |
          npm ci
          wget -q -O openapi-agent.json "https://api.eu.amaise.com/doc/api-documentation/AGENT-SDK"
          npm run generate
          make verify
          make dep-check

  create-release:
    needs:
      - build-example-spring
      - build-example-quarkus
      - build-example-nodejs
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Get the tag version
        id: get_version
        run: echo "VERSION=$(echo "$GITHUB_REF" | cut -d / -f 3)" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          grep -vE '^[[:space:]]*(#|$)' release-manifest.txt > /tmp/manifest.txt
          while IFS= read -r path; do
            [ -e "$path" ] || { echo "::error::release-manifest.txt lists a missing path: $path"; exit 1; }
          done < /tmp/manifest.txt
          tr '\n' '\0' < /tmp/manifest.txt | xargs -0 zip -qr sdk-release.zip

      # A customer's first act is to unzip and build, so do exactly that before
      # the draft exists. Globs never matched .mvn, so every artefact published
      # so far could not bootstrap ./mvnw and no gate noticed.
      - name: Build every example from the artefact
        run: |
          unzip -q sdk-release.zip -d /tmp/unpacked
          (cd /tmp/unpacked/agent-example-spring && ./mvnw -B -q package -DskipTests)
          (cd /tmp/unpacked/agent-example-quarkus && ./mvnw -B -q package -DskipTests)
          cd /tmp/unpacked/agent-example-nodejs
          npm ci
          wget -q -O openapi-agent.json "https://api.eu.amaise.com/doc/api-documentation/AGENT-SDK"
          npm run generate
          make verify

      # Fails when the tag has no CHANGELOG section, so a release can never be
      # cut with the placeholder body a human then has to retype.
      # Inlined rather than calling sdk/tools/, which is outside the mirrored
      # subtree and so does not exist in the repository this workflow runs in.
      - name: Assemble the release body
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          awk -v want="## $VERSION" '
            $0 == want { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          cat release-body.md

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: 'sdk-release.zip'
          tag: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: true
          bodyFile: release-body.md
          allowUpdates: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: "Notify Failure"
    needs: [build-example-spring, build-example-quarkus, build-example-nodejs, create-release]
    if: >-
      always()
      && (needs.build-example-spring.result == 'failure'
      || needs.build-example-quarkus.result == 'failure'
      || needs.build-example-nodejs.result == 'failure'
      || needs.create-release.result == 'failure')
    uses: ./.github/workflows/_notify-slack.yml
    with:
      environment: release
      status: failure
    secrets:
      SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
